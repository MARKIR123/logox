# Logox 内置默认配置（与 config/schema.py 的字段默认值**逐字段一致**）
#
# 本文件不是加载路径的一部分——真正的默认值来自 schema.py 的 pydantic 字段默认值，
# 由测试 T-30 守护两者不漂移。它的作用是让人**一眼看到全部可配置项与默认值**，
# 可以整段复制到 ~/.logox/config.toml 再按需修改。
#
# 注意：密钥只能通过 api_key_env 指向环境变量，禁止在此写 api_key（会被拒绝）。

schema_version = 1

[provider]
name = "openai-compatible"
model = ""
temperature = 0.2
max_tokens = 16384
request_timeout_s = 120.0
thinking_effort = "auto"          # off | low | medium | high | auto（D42）

# [providers.example]
# kind = "openai_compat"          # openai_compat | anthropic
# base_url = "https://api.deepseek.com/v1"
# api_key_env = "DEEPSEEK_API_KEY"
# models = ["deepseek-chat", "deepseek-reasoner"]

[kernel]
max_iterations = 50               # 一个回合内最多几轮「模型要工具 → 执行 → 再要」（M3/D94）
max_retries = 3                   # 可重试错误的最大重试次数（D22 / D52）
retry_base_s = 0.5                # 首次退避；此后指数增长（±20% 抖动）
retry_max_s = 30.0                # 退避上限，也是厂商 Retry-After 的裁剪上限
concurrency = 4                   # 只读工具批的并发度（D27）

[context]
# 压缩判据 = 窗口 − reserve_tokens（不是"窗口 × 比例"：那在 1M 窗口下会把触发点压到 8%）
reserve_tokens = 32768            # 给"回答 + 估算误差"预留；默认 = 默认 max_tokens 的两倍
low_watermark_ratio = 0.5         # 修剪后降到窗口的这个比例以下即算完成
max_budget_tokens = 0             # 成本闸门：只能压低水位线，不能抬高；0 = 不封顶

keep_recent_turns = 2             # 压缩时保留多少个**完整轮次**
keep_recent_tool_results = 2      # 全局保留最近多少**条工具结果**

rehydrate_files = 5               # 折叠后重新读回最近 N 个碰过的文件（0 = 关闭）
rehydrate_max_chars = 2000        # 每个文件最多读回多少字符

project_memory_enabled = true     # 关掉则完全不读项目 LOGOX.md

[anamnesis]
enabled = true
memory_enabled = true
idle_seconds = 1800
sleep_start = "00:00"
sleep_end = "08:00"
provider = "ollama"
model = ""                       # Explicit local model; no cloud fallback.
request_timeout_s = 180.0        # 入梦连续无模型数据期限，不是请求总时长
nap_max_steps = 4
sleep_max_steps = 64
user_archive_tokens = 800
project_archive_tokens = 1600
prompt_memory_max_ratio = 0.05

[shell]
backend = "auto"                  # auto | gitbash | wsl | powershell（D19）
timeout_s = 120.0
kill_tree = true                  # D22：Esc 时杀灭进程树

[permissions]
default_decision = "ask"          # allow | deny | ask（D10 / D34）
learn_scope = "project"           # session | project | global

[tools]
enabled = ["read", "write", "edit", "glob", "grep", "shell", "todo"]   # D18
readonly_concurrency = 4          # D27

[hooks]
enabled = true                    # D23：仅观察型钩子
blocking = true
timeout_s = 5.0

# [[hooks.entries]]
# event = "post_tool_use"         # session_start | post_tool_use | pre_compact | notification | stop
# matcher = "edit|write"
# command = "ruff format $LOGOX_FILE_PATH"

[mcp]
enabled = true                    # D20
default_timeout = 30.0            # D109

# [[mcp.servers]]
# name = "filesystem"
# transport = "stdio"             # stdio | http
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "."]
# enabled = true
# startup_timeout_s = 20.0

[ui]
theme = "logox-dark"              # D43：logox-dark | logox-light | logox-contrast
layout = "auto"                   # auto | dual | single
fullscreen = false
sidebar_width = 32
diff_context_lines = 3
stream_fps = 30
show_reasoning = "collapsed"      # collapsed | expanded | hidden（D31）
icon_set = "unicode"              # unicode | ascii | nerd
animations = true

# D42：默认仅开 4 项（model 已含思考档位）
[ui.status_items]
model = true
context = true
throughput = true
cache = true
tool = false
turn = false
usage = false
timing = false
permission = false
git = false
session = false

[ui.timing_fields]
total = true
llm = true
tool = true

[session]
store_dir = ""
log_events = true                 # D25
log_redact = true

[plugins]
enabled = true
paths = []
